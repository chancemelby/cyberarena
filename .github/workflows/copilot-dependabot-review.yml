name: Copilot Dependabot Breaking Change Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  models: read

jobs:
  analyze-breaking-changes:
    name: Check for Breaking Changes with Copilot
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'dependabot'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask Copilot to check for breaking changes
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execFileSync } = require('child_process');

            const prNumber = context.payload.pull_request.number;
            const prTitle  = context.payload.pull_request.title || '';
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;

            // 1. Extract the dependency upgrade info from the PR title.
            //    Dependabot formats titles as "Bump <pkg> from <old> to <new>" or
            //    "build(deps): bump <pkg> from <old> to <new>".
            const bumpMatch = prTitle.match(
              /bump\s+([^\s]+)\s+from\s+(v?[\d][^\s]*)\s+to\s+(v?[\d][^\s]*)/i
            );
            const packageName = bumpMatch ? bumpMatch[1] : 'the dependency';
            const oldVersion  = bumpMatch ? bumpMatch[2] : 'the current version';
            const newVersion  = bumpMatch ? bumpMatch[3] : 'the new version';

            // 2. Gather the manifest file diffs for context.
            const { data: changedFiles } = await github.rest.pulls.listFiles({
              owner, repo, pull_number: prNumber, per_page: 100
            });

            let diffContext = '';
            for (const file of changedFiles.slice(0, 10)) {
              if (file.patch) {
                const patch = file.patch.length > 2000
                  ? file.patch.slice(0, file.patch.lastIndexOf('\n', 2000)) + '\n... (truncated)'
                  : file.patch;
                diffContext += `\n**${file.filename}**\n\`\`\`diff\n${patch}\n\`\`\`\n`;
              }
            }

            // 3. Scan the codebase for source files that reference the package.
            //    execFileSync is used (no shell) to safely pass the package name as an argument.
            let usageContext = '';
            const safeName = packageName.replace(/[^A-Za-z0-9_\-\./@]/g, '');
            if (safeName && bumpMatch) {
              try {
                const grepOut = execFileSync(
                  'grep',
                  [
                    '-rn', '-F', safeName,
                    '--include=*.py', '--include=*.js', '--include=*.ts',
                    '--include=*.go', '--include=*.rs', '--include=*.rb',
                    '--include=*.java', '--include=*.cs', '--include=*.php',
                    '--exclude-dir=node_modules', '--exclude-dir=.git',
                    '--exclude-dir=vendor', '--exclude-dir=__pycache__',
                    '--exclude-dir=.tox', '--exclude-dir=dist', '--exclude-dir=build',
                    '.'
                  ],
                  { cwd: process.env.GITHUB_WORKSPACE || '.', encoding: 'utf8', timeout: 20000 }
                );
                const lines = grepOut.trim().split('\n').slice(0, 40).join('\n');
                if (lines) {
                  usageContext = `\n**Codebase references to \`${packageName}\`:**\n\`\`\`\n${lines}\n\`\`\`\n`;
                }
              } catch (err) {
                // grep exits non-zero when no matches found; only log unexpected errors
                if (err.status !== 1 && err.stdout) {
                  const lines = err.stdout.trim().split('\n').slice(0, 40).join('\n');
                  if (lines) {
                    usageContext = `\n**Codebase references to \`${packageName}\`:**\n\`\`\`\n${lines}\n\`\`\`\n`;
                  }
                }
              }
            }

            // 4. Build the message to send to Copilot.
            const copilotMessage =
              `Check the repository for breaking changes from ${oldVersion} to ${newVersion} of \`${packageName}\`.\n\n` +
              `**Pull Request:** ${prTitle}\n` +
              `**Repository:** ${owner}/${repo}\n\n` +
              `**Manifest file changes:**\n` +
              (diffContext || '_No diff available._') + '\n' +
              (usageContext || '\n**Codebase references:** _No direct usages found in source files._\n') +
              `\nPlease:\n` +
              `1. Identify any breaking API changes, removed or renamed methods/classes/interfaces, ` +
              `changed function signatures, or incompatible behavior changes introduced between ` +
              `versions \`${oldVersion}\` and \`${newVersion}\` of \`${packageName}\`.\n` +
              `2. Cross-reference those breaking changes with the codebase references shown above ` +
              `to determine which files and line numbers would be impacted.\n` +
              `3. Provide clear, actionable recommendations.\n\n` +
              `Format your response as:\n\n` +
              `**Status:** ⚠️ Breaking Changes Detected  _or_  ✅ No Breaking Changes Detected\n\n` +
              `**Breaking Changes Found:**\n` +
              `_(List each breaking change with the version it was introduced, or "None detected.")_\n\n` +
              `**Impact on This Repository:**\n` +
              `_(List affected files and line numbers, or "No direct impact detected.")_\n\n` +
              `**Required Actions Before Merging:**\n` +
              `_(Specific remediation steps, or "None required — safe to merge.")_\n\n` +
              `**References:**\n` +
              `_(Links to changelog, release notes, or migration guide.)_`;

            // 5. Call the GitHub Models API (Copilot) to perform the analysis.
            let analysis = '';
            try {
              const requestBody = JSON.stringify({
                model: 'openai/gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content:
                      'You are GitHub Copilot, a security-focused AI assistant. ' +
                      'Your task is to analyze Dependabot pull requests for breaking changes ' +
                      'that could affect the repository codebase. ' +
                      'Be thorough, precise, and actionable.'
                  },
                  {
                    role: 'user',
                    content: copilotMessage
                  }
                ],
                max_tokens: 2000,
                temperature: 0.1
              });

              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                },
                body: requestBody,
                signal: AbortSignal.timeout(60000)
              });

              const responseText = await response.text();
              let aiResponse;
              try {
                aiResponse = JSON.parse(responseText);
              } catch (parseErr) {
                console.log(`Failed to parse Models API response (HTTP ${response.status}):`, responseText.slice(0, 500));
                throw new Error(`Models API returned non-JSON response (HTTP ${response.status})`);
              }

              if (!response.ok) {
                const errMsg = (aiResponse && aiResponse.error && aiResponse.error.message) || JSON.stringify(aiResponse).slice(0, 300);
                console.log(`Models API error (HTTP ${response.status}):`, errMsg);
                throw new Error(`Models API returned HTTP ${response.status}: ${errMsg}`);
              }

              if (aiResponse.choices && aiResponse.choices[0]) {
                analysis = aiResponse.choices[0].message.content;
              } else {
                console.log(`Unexpected Models API response structure (HTTP ${response.status}):`, JSON.stringify(aiResponse).slice(0, 500));
                analysis =
                  `> ⚠️ Copilot analysis could not be completed automatically.\n\n` +
                  `Please review the \`${packageName}\` upgrade from \`${oldVersion}\` to \`${newVersion}\` manually.`;
              }
            } catch (err) {
              console.log(`GitHub Models API error: ${err.message}`);
              analysis =
                `> ⚠️ Copilot analysis unavailable: ${err.message}\n\n` +
                `Please review this upgrade manually.`;
            }

            // 6. Post the Copilot analysis as a PR comment.
            const commentBody = [
              '## 🤖 Copilot Dependency Analysis',
              '',
              `> Analyzing \`${packageName}\` upgrade: \`${oldVersion}\` → \`${newVersion}\``,
              '',
              analysis,
              '',
              '---',
              '*Automated analysis by GitHub Copilot · [Workflow](.github/workflows/copilot-dependabot-review.yml)*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: commentBody
            });

            console.log(`✅ Posted Copilot analysis for ${packageName} (${oldVersion} → ${newVersion}) on PR #${prNumber}`);
