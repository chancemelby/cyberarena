name: Copilot Dependabot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-dependabot-review:
    name: Request Copilot Review for Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'dependabot'

    steps:
      - name: Request Copilot as Reviewer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prTitle = context.payload.pull_request.title;

            console.log(`Dependabot PR detected: #${prNumber} - ${prTitle}`);

            // Request Copilot as a reviewer so it can analyze the dependency upgrade
            // Copilot will follow the analysis instructions in .github/copilot-instructions.md
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['copilot']
              });
              console.log('Successfully requested Copilot review');
            } catch (error) {
              console.log('Note: Could not automatically add Copilot as a reviewer:', error.message);
              console.log('Please manually add Copilot as a reviewer on this PR.');
            }
